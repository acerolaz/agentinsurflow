# Déploiement d'une image dans un environnement, suivi d'un test de fumée bloquant.
# - appelé par ci-cd.yml après chaque merge (tag = SHA du commit) ;
# - lancé à la main = ROLLBACK en une opération : `make rollback` ou Actions › deploy › Run
#   workflow. Sans tag : redéploie l'image de la révision précédente.
name: deploy

on:
  workflow_call:
    inputs:
      environnement: { type: string, required: true }
      tag: { type: string, required: true }
      # release vX.Y.Z livrée : vérifiée ≥ celle en service (ci-cd.yml la passe pour la production)
      release: { type: string, required: false, default: "" }
    outputs:
      url:
        description: URL publique de l'environnement déployé
        value: ${{ jobs.deploy.outputs.url }}
      cluster_fqdn:
        description: FQDN interne du cluster d'agents (le test E2E vérifie qu'il ne répond pas de l'extérieur)
        value: ${{ jobs.deploy.outputs.cluster_fqdn }}
  workflow_dispatch:
    inputs:
      environnement:
        type: choice
        options: [production, staging]
        default: production
      tag:
        description: "SHA de l'image ; vide = version précédente (rollback)"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environnement }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployer.outputs.url }}
      cluster_fqdn: ${{ steps.cluster.outputs.fqdn }}
    environment:
      name: ${{ inputs.environnement }}
      url: ${{ steps.deployer.outputs.url }}
    env:
      APP: ${{ vars.CONTAINER_APP_NAME }}
      UW_APP: ${{ vars.UW_APP_NAME }}
      MCP_APP: ${{ vars.MCP_APP_NAME }}
      CLUSTER_APP: ${{ vars.CLUSTER_APP_NAME }}
      RAG_APP: ${{ vars.RAG_APP_NAME }}
      PG_APP: ${{ vars.PG_APP_NAME }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Garde-fou — variables requises présentes avant toute mise à jour
        env:
          # injectées dans les modèles : vides, elles donneraient des audiences vides ou `api://` après des mises à jour déjà faites
          ACR_NAME: ${{ vars.ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAG_API_CLIENT_ID: ${{ vars.RAG_API_CLIENT_ID }}
          UNDERWRITING_API_CLIENT_ID: ${{ vars.UNDERWRITING_API_CLIENT_ID }}
          MCP_API_CLIENT_ID: ${{ vars.MCP_API_CLIENT_ID }}
          SEED_GESTIONNAIRE_A: ${{ vars.SEED_GESTIONNAIRE_A }}
          SEED_GESTIONNAIRE_B: ${{ vars.SEED_GESTIONNAIRE_B }}
          CLUSTER_APP_NAME: ${{ vars.CLUSTER_APP_NAME }}
          INSURFLOW_CLUSTER_CLIENT_ID: ${{ vars.INSURFLOW_CLUSTER_CLIENT_ID }}
          INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID }}
          INSURFLOW_AGENT_PIECES_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_PIECES_CLIENT_ID }}
          INSURFLOW_AGENT_ANALYSTE_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ANALYSTE_CLIENT_ID }}
          INSURFLOW_AGENT_REDACTEUR_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_REDACTEUR_CLIENT_ID }}
          INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID }}
          AZURE_UAMI_CLUSTER_CLIENT_ID: ${{ vars.AZURE_UAMI_CLUSTER_CLIENT_ID }}
          MCP_AZP_ORCHESTRATEUR: ${{ vars.MCP_AZP_ORCHESTRATEUR }}
          MCP_AZP_REDACTEUR: ${{ vars.MCP_AZP_REDACTEUR }}
          MCP_AZP_ACTUAIRE: ${{ vars.MCP_AZP_ACTUAIRE }}
          MCP_AZP_PIECES: ${{ vars.MCP_AZP_PIECES }}
          MCP_AZP_ANALYSTE: ${{ vars.MCP_AZP_ANALYSTE }}
          UW_APP_NAME: ${{ vars.UW_APP_NAME }}
          MCP_APP_NAME: ${{ vars.MCP_APP_NAME }}
          RAG_APP_NAME: ${{ vars.RAG_APP_NAME }}
          PG_APP_NAME: ${{ vars.PG_APP_NAME }}
          CALCUL_APP_NAME: ${{ vars.CALCUL_APP_NAME }}
          CALCUL_URL: ${{ vars.CALCUL_URL }}
          CALCUL_AUDIENCE: ${{ vars.CALCUL_AUDIENCE }}
          CALCUL_API_CLIENT_ID: ${{ vars.CALCUL_API_CLIENT_ID }}
          AZURE_UAMI_CLIENT_ID: ${{ vars.AZURE_UAMI_CLIENT_ID }}
          AZURE_UAMI_MCP_CLIENT_ID: ${{ vars.AZURE_UAMI_MCP_CLIENT_ID }}
          AZURE_UAMI_RAG_CLIENT_ID: ${{ vars.AZURE_UAMI_RAG_CLIENT_ID }}
          LLM_AUDIENCE: ${{ vars.LLM_AUDIENCE }}
          LLM_API_CLIENT_ID: ${{ vars.LLM_API_CLIENT_ID }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
        run: |
          manque=0
          # facultatives (non contrôlées) : RAG_SEUIL (vide : /api/extraits en 503), PROD_URL
          for v in ACR_NAME AZURE_RESOURCE_GROUP CONTAINER_APP_NAME AZURE_TENANT_ID RAG_API_CLIENT_ID UNDERWRITING_API_CLIENT_ID MCP_API_CLIENT_ID SEED_GESTIONNAIRE_A SEED_GESTIONNAIRE_B CALCUL_APP_NAME CALCUL_URL CALCUL_AUDIENCE CALCUL_API_CLIENT_ID UW_APP_NAME MCP_APP_NAME RAG_APP_NAME PG_APP_NAME AZURE_UAMI_CLIENT_ID AZURE_UAMI_MCP_CLIENT_ID AZURE_UAMI_RAG_CLIENT_ID LLM_AUDIENCE LLM_API_CLIENT_ID FOUNDRY_ENDPOINT CLUSTER_APP_NAME INSURFLOW_CLUSTER_CLIENT_ID INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID INSURFLOW_AGENT_PIECES_CLIENT_ID INSURFLOW_AGENT_ANALYSTE_CLIENT_ID INSURFLOW_AGENT_REDACTEUR_CLIENT_ID INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID AZURE_UAMI_CLUSTER_CLIENT_ID MCP_AZP_ORCHESTRATEUR MCP_AZP_REDACTEUR MCP_AZP_ACTUAIRE MCP_AZP_PIECES MCP_AZP_ANALYSTE; do
            [ -n "${!v}" ] || { echo "::error::variable $v vide pour cet environnement (docs/secrets.md) : aucune mise à jour lancée"; manque=1; }
          done
          exit "$manque"

      - uses: actions/checkout@v4 # infra/containerapp.yaml

      - name: Choisir le SHA des images
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            # Rollback : le SHA de l'avant-dernière révision, lu sur l'image de sa gateway
            image=$(az containerapp revision list -n "$APP" -g "$RG" --all --query \
              "sort_by([], &properties.createdTime)[-2].properties.template.containers[?name=='gateway'].image | [0]" -o tsv)
            TAG=${image##*:}
          fi
          test -n "$TAG" || { echo "::error::aucune révision précédente avec une gateway"; exit 1; }
          # Les 5 images doivent exister pour ce SHA (lecture seule) : pas de déploiement partiel.
          # Rollback vers une révision d'avant U5 : agentinsurflow-underwriting:<ancien SHA> n'existe pas.
          for depot in rag underwriting gateway mcp cluster; do
            az acr repository show -n "${{ vars.ACR_NAME }}" --image "agentinsurflow-$depot:$TAG" -o none 2>/dev/null ||
              { echo "::error::image agentinsurflow-$depot:$TAG absente de l'ACR : déploiement ou rollback refusé (voir docs/rollback.md)"; exit 1; }
          done
          echo "SHA retenu : $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Version croissante — hors rollback, la release livrée ne descend pas sous celle en service
        # lancé à la main (rollback, TAG précis) : pas de release, donc pas de contrôle
        if: inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          url="${{ inputs.environnement == 'production' && vars.PROD_URL || '' }}"
          [ -n "$url" ] || url="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          # environnement injoignable : refus (fail-closed) ; revenir en arrière passe par le rollback
          sante=$(curl -fsS "$url/health") || { echo "::error::$url/health injoignable : release en service inconnue"; exit 1; }
          python3 tools/version.py --verifier "$(echo "$sante" | jq -r '.release // empty')" "$RELEASE"

      - uses: actions/checkout@v4 # code de la Function du même commit que les images (rollback cohérent)
        with:
          ref: ${{ steps.image.outputs.tag }}
          path: calcul-src

      - name: Déployer la Function de calcul
        env:
          CALCUL_APP_NAME: ${{ vars.CALCUL_APP_NAME }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          (cd calcul-src/fonction-calcul && zip -qr "$RUNNER_TEMP/calcul.zip" function_app.py host.json requirements.txt agentinsurflow_calcul \
            -x '*/__pycache__/*')
          az functionapp config appsettings set -g "$RG" -n "$CALCUL_APP_NAME" --settings "APP_VERSION=$TAG" -o none
          az functionapp deployment source config-zip -g "$RG" -n "$CALCUL_APP_NAME" --src "$RUNNER_TEMP/calcul.zip" --build-remote true -o none

      - name: Fumée de la Function — bonne version, API fermée sans jeton (porte bloquante)
        env:
          CALCUL_URL: ${{ vars.CALCUL_URL }}
          attendu: ${{ steps.image.outputs.tag }}
        run: |
          for _ in $(seq 1 30); do
            version=$(curl -fsS --max-time 10 "$CALCUL_URL/api/sante" | jq -r .version) || version=""
            [ "$version" = "$attendu" ] && break
            sleep 5
          done
          [ "$version" = "$attendu" ] || { echo "::error::Function de calcul : version '$version' ≠ '$attendu'"; exit 1; }
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$CALCUL_URL/api/evaluer" -H 'content-type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "::error::POST /api/evaluer sans jeton : $code ≠ 401"; exit 1; }
          echo "✔ Function de calcul en $attendu, /api/evaluer fermée sans jeton"

      # Ordre : base annexe → underwriting-admin → serveur MCP → cluster d'agents → gateway → rag. La base annexe d'abord : ses clients (underwriting-admin, rag) attendent PostgreSQL à leur démarrage pour jouer
      # leurs migrations. Chaque déploiement crée une nouvelle révision (DEPLOIEMENT = SHA) : base vide, comme avant
      # la séparation ; les clients, redéployés ensuite, repartent sur une base fraîche.
      - name: Déployer la base annexe (modèle infra/containerapp-postgres.yaml, TCP interne 5432)
        env:
          IMAGE_POSTGRES: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-postgres:2 # tag fixe, construit à la main (infra/postgres-annexe.sh)
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_POSTGRES $TAG' < infra/containerapp-postgres.yaml > "$RUNNER_TEMP/containerapp-postgres.yaml"
          az containerapp update -n "$PG_APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp-postgres.yaml" -o none
          # La nouvelle révision doit être prête ET seule active avant de déployer ses clients : sinon underwriting-admin
          # migre dans l'ancienne base, éteinte ensuite, et tourne sans schéma (42P01, run #83 du 23/10).
          derniere=$(az containerapp show -n "$PG_APP" -g "$RG" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 60); do
            prete=$(az containerapp show -n "$PG_APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
            actives=$(az containerapp revision list -n "$PG_APP" -g "$RG" --query "[?properties.active].name" -o tsv)
            [ "$prete" = "$derniere" ] && [ "$actives" = "$derniere" ] && break
            sleep 5
          done
          [ "$prete" = "$derniere" ] && [ "$actives" = "$derniere" ] ||
            { echo "::error::$PG_APP : la révision $derniere n'est pas seule active après 5 min (actives : ${actives//$'\n'/ })"; exit 1; }
          echo "✔ $PG_APP : révision $derniere prête et seule active"
          pg=$(az containerapp show -n "$PG_APP" -g "$RG" -o json)
          jq -e '.properties.configuration.ingress | (.external == false) and ((.transport // "" | ascii_downcase) == "tcp") and (.targetPort == 5432)' <<<"$pg" > /dev/null ||
            { echo "::error::$PG_APP : l'entrée doit être TCP interne sur 5432 (relancer make infra, voir docs/secrets.md)"; exit 1; }
          for secret in pg-postgres-password pg-migrateur-password pg-writer-password pg-reader-password \
            pg-dossiers-password pg-traces-writer-password pg-traces-reader-password pg-agent-state-password; do
            jq -e --arg s "$secret" '[.properties.configuration.secrets[]?.name] | index($s)' <<<"$pg" > /dev/null ||
              { echo "::error::secret $secret absent de $PG_APP (relancer infra/postgres-annexe.sh)"; exit 1; }
          done
          echo "✔ $PG_APP déployé (base vide), entrée TCP interne 5432, 8 secrets pg-*"

      # underwriting-admin avant la gateway : son FQDN interne est le cluster `underwriting` et la cible des traces de la gateway
      - name: Déployer underwriting-admin (modèle infra/containerapp-underwriting.yaml, Container App interne)
        id: uw
        env:
          IMAGE_UNDERWRITING: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-underwriting:${{ steps.image.outputs.tag }}
          # la base annexe : nom de sa Container App (TCP interne 5432)
          PG_HOST: ${{ vars.PG_APP_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          UNDERWRITING_API_CLIENT_ID: ${{ vars.UNDERWRITING_API_CLIENT_ID }}
          SEED_GESTIONNAIRE_A: ${{ vars.SEED_GESTIONNAIRE_A }}
          SEED_GESTIONNAIRE_B: ${{ vars.SEED_GESTIONNAIRE_B }}
        run: |
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_UNDERWRITING $PG_HOST $AZURE_TENANT_ID $UNDERWRITING_API_CLIENT_ID $SEED_GESTIONNAIRE_A $SEED_GESTIONNAIRE_B' \
            < infra/containerapp-underwriting.yaml > "$RUNNER_TEMP/containerapp-underwriting.yaml"
          az containerapp update -n "$UW_APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp-underwriting.yaml" -o none
          fqdn=$(az containerapp show -n "$UW_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn" || { echo "::error::FQDN interne de $UW_APP introuvable (make infra)"; exit 1; }
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          uw=$(az containerapp show -n "$UW_APP" -g "$RG" -o json)
          jq -e '.properties.configuration.ingress.external == false' <<<"$uw" > /dev/null ||
            { echo "::error::$UW_APP exposé hors de l'environnement : l'entrée doit rester interne"; exit 1; }
          for secret in pg-migrateur-password pg-dossiers-password pg-traces-writer-password pg-traces-reader-password; do
            jq -e --arg s "$secret" '[.properties.configuration.secrets[]?.name] | index($s)' <<<"$uw" > /dev/null ||
              { echo "::error::secret $secret perdu par l'update de $UW_APP (relancer infra/postgres-annexe.sh)"; exit 1; }
          done
          echo "✔ $UW_APP déployé, entrée interne $fqdn, 4 secrets pg-* conservés"

      - name: Déployer le serveur MCP (modèle infra/containerapp-mcp.yaml, Container App interne)
        id: mcp
        env:
          IMAGE_MCP: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-mcp:${{ steps.image.outputs.tag }}
          APP_ENV: ${{ inputs.environnement }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAG_API_CLIENT_ID: ${{ vars.RAG_API_CLIENT_ID }}
          UNDERWRITING_API_CLIENT_ID: ${{ vars.UNDERWRITING_API_CLIENT_ID }}
          MCP_API_CLIENT_ID: ${{ vars.MCP_API_CLIENT_ID }}
          MCP_AZP_ORCHESTRATEUR: ${{ vars.MCP_AZP_ORCHESTRATEUR }}
          MCP_AZP_REDACTEUR: ${{ vars.MCP_AZP_REDACTEUR }}
          MCP_AZP_ACTUAIRE: ${{ vars.MCP_AZP_ACTUAIRE }}
          MCP_AZP_PIECES: ${{ vars.MCP_AZP_PIECES }}
          MCP_AZP_ANALYSTE: ${{ vars.MCP_AZP_ANALYSTE }}
          AZURE_UAMI_MCP_CLIENT_ID: ${{ vars.AZURE_UAMI_MCP_CLIENT_ID }}
          CALCUL_AUDIENCE: ${{ vars.CALCUL_AUDIENCE }}
        run: |
          # Le MCP joint la gateway par le FQDN de sa Container App (entrée externe, https) : même environnement,
          # donc pas de détour exotique, et le certificat est celui de la plateforme (curl et httpx sans -k)
          GATEWAY_URL="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          export GATEWAY_URL
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_MCP $APP_ENV $AZURE_TENANT_ID $RAG_API_CLIENT_ID $UNDERWRITING_API_CLIENT_ID $MCP_API_CLIENT_ID $MCP_AZP_ORCHESTRATEUR $MCP_AZP_REDACTEUR $MCP_AZP_ACTUAIRE $MCP_AZP_PIECES $MCP_AZP_ANALYSTE $AZURE_UAMI_MCP_CLIENT_ID $GATEWAY_URL $CALCUL_AUDIENCE' \
            < infra/containerapp-mcp.yaml > "$RUNNER_TEMP/containerapp-mcp.yaml"
          az containerapp update -n "$MCP_APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp-mcp.yaml" -o none
          # FQDN interne (<app>.internal.<domaine de l'environnement>) : la gateway l'appelle en https, port 443 -> 8003
          fqdn=$(az containerapp show -n "$MCP_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn" || { echo "::error::FQDN interne de $MCP_APP introuvable"; exit 1; }
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          mcp=$(az containerapp show -n "$MCP_APP" -g "$RG" -o json)
          jq -e --arg u "$AZURE_UAMI_MCP_CLIENT_ID" '[.identity.userAssignedIdentities // {} | .[] | .clientId | ascii_downcase] | index($u | ascii_downcase)' <<<"$mcp" > /dev/null ||
            { echo "::error::identité managée $AZURE_UAMI_MCP_CLIENT_ID absente de $MCP_APP après l'update (OBO du serveur MCP impossible)"; exit 1; }
          jq -e '.properties.configuration.ingress.external == false' <<<"$mcp" > /dev/null ||
            { echo "::error::$MCP_APP exposé hors de l'environnement : l'entrée doit rester interne"; exit 1; }
          echo "✔ $MCP_APP déployé, entrée interne $fqdn, identité managée propre posée"

      # Cluster d'agents avant la gateway : son FQDN interne est le cluster `cluster` de la gateway. Après la base annexe :
      # il y ouvre ses points de reprise (compte agent_state) dès son démarrage.
      - name: Déployer le cluster d'agents (modèle infra/containerapp-cluster.yaml, Container App interne)
        id: cluster
        env:
          IMAGE_CLUSTER: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-cluster:${{ steps.image.outputs.tag }}
          APP_ENV: ${{ inputs.environnement }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_UAMI_CLUSTER_CLIENT_ID: ${{ vars.AZURE_UAMI_CLUSTER_CLIENT_ID }}
          MCP_API_CLIENT_ID: ${{ vars.MCP_API_CLIENT_ID }}
          LLM_AUDIENCE: ${{ vars.LLM_AUDIENCE }}
          INSURFLOW_CLUSTER_CLIENT_ID: ${{ vars.INSURFLOW_CLUSTER_CLIENT_ID }}
          INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID }}
          INSURFLOW_AGENT_PIECES_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_PIECES_CLIENT_ID }}
          INSURFLOW_AGENT_ANALYSTE_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ANALYSTE_CLIENT_ID }}
          INSURFLOW_AGENT_REDACTEUR_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_REDACTEUR_CLIENT_ID }}
          INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID: ${{ vars.INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID }}
        run: |
          # comme le MCP : la gateway par le FQDN de sa Container App (entrée externe, https)
          GATEWAY_URL="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          # version du modèle LLM : épinglée et versionnée avec rag (rag/llm.env), pas une variable GitHub
          AZURE_OPENAI_DEPLOYMENT=$(sed -n 's/^AZURE_OPENAI_DEPLOYMENT=//p' rag/llm.env)
          test -n "$AZURE_OPENAI_DEPLOYMENT" || { echo "::error::AZURE_OPENAI_DEPLOYMENT absent de rag/llm.env"; exit 1; }
          export GATEWAY_URL AZURE_OPENAI_DEPLOYMENT
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_CLUSTER $APP_ENV $AZURE_TENANT_ID $AZURE_UAMI_CLUSTER_CLIENT_ID $MCP_API_CLIENT_ID $LLM_AUDIENCE $AZURE_OPENAI_DEPLOYMENT $GATEWAY_URL $INSURFLOW_CLUSTER_CLIENT_ID $INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID $INSURFLOW_AGENT_PIECES_CLIENT_ID $INSURFLOW_AGENT_ANALYSTE_CLIENT_ID $INSURFLOW_AGENT_REDACTEUR_CLIENT_ID $INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID' \
            < infra/containerapp-cluster.yaml > "$RUNNER_TEMP/containerapp-cluster.yaml"
          az containerapp update -n "$CLUSTER_APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp-cluster.yaml" -o none
          fqdn=$(az containerapp show -n "$CLUSTER_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn" || { echo "::error::FQDN interne de $CLUSTER_APP introuvable (make infra)"; exit 1; }
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          cluster=$(az containerapp show -n "$CLUSTER_APP" -g "$RG" -o json)
          jq -e --arg u "$AZURE_UAMI_CLUSTER_CLIENT_ID" '[.identity.userAssignedIdentities // {} | .[] | .clientId | ascii_downcase] | index($u | ascii_downcase)' <<<"$cluster" > /dev/null ||
            { echo "::error::identité managée $AZURE_UAMI_CLUSTER_CLIENT_ID absente de $CLUSTER_APP après l'update (OBO du cluster impossible)"; exit 1; }
          jq -e '.properties.configuration.ingress.external == false' <<<"$cluster" > /dev/null ||
            { echo "::error::$CLUSTER_APP exposé hors de l'environnement : l'entrée doit rester interne"; exit 1; }
          jq -e '[.properties.configuration.secrets[]?.name] | index("checkpoint-dsn")' <<<"$cluster" > /dev/null ||
            { echo "::error::secret checkpoint-dsn absent de $CLUSTER_APP (relancer infra/postgres-annexe.sh)"; exit 1; }
          jq -e '.properties.template.scale | (.minReplicas == 1) and (.maxReplicas == 1)' <<<"$cluster" > /dev/null ||
            { echo "::error::$CLUSTER_APP : une seule réplique exigée (verrou par dossier, R17)"; exit 1; }
          echo "✔ $CLUSTER_APP déployé, entrée interne $fqdn, identité managée propre, une réplique, secret checkpoint-dsn conservé"

      - name: Déployer la gateway (modèle infra/containerapp.yaml, nouvelle révision ; elle seule dans la principale)
        id: deployer
        env:
          IMAGE_GATEWAY: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-gateway:${{ steps.image.outputs.tag }}
          MCP_APP_FQDN: ${{ steps.mcp.outputs.fqdn }}
          CLUSTER_APP_FQDN: ${{ steps.cluster.outputs.fqdn }}
          INSURFLOW_CLUSTER_CLIENT_ID: ${{ vars.INSURFLOW_CLUSTER_CLIENT_ID }}
          UNDERWRITING_APP_FQDN: ${{ steps.uw.outputs.fqdn }}
          APP_ENV: ${{ inputs.environnement }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAG_API_CLIENT_ID: ${{ vars.RAG_API_CLIENT_ID }}
          UNDERWRITING_API_CLIENT_ID: ${{ vars.UNDERWRITING_API_CLIENT_ID }}
          MCP_API_CLIENT_ID: ${{ vars.MCP_API_CLIENT_ID }}
          AZURE_UAMI_CLIENT_ID: ${{ vars.AZURE_UAMI_CLIENT_ID }}
          LLM_AUDIENCE: ${{ vars.LLM_AUDIENCE }}
          LLM_API_CLIENT_ID: ${{ vars.LLM_API_CLIENT_ID }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          CALCUL_URL: ${{ vars.CALCUL_URL }}
          CALCUL_AUDIENCE: ${{ vars.CALCUL_AUDIENCE }}
          CALCUL_API_CLIENT_ID: ${{ vars.CALCUL_API_CLIENT_ID }}
        run: |
          # rag a sa Container App (entrée interne) : son FQDN existe depuis `make infra`, la gateway le vise (cluster rag)
          RAG_APP_FQDN=$(az containerapp show -n "$RAG_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$RAG_APP_FQDN" || { echo "::error::FQDN interne de $RAG_APP introuvable (make infra)"; exit 1; }
          export RAG_APP_FQDN
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_GATEWAY $UNDERWRITING_APP_FQDN $APP_ENV $AZURE_TENANT_ID $RAG_API_CLIENT_ID $UNDERWRITING_API_CLIENT_ID $MCP_API_CLIENT_ID $AZURE_UAMI_CLIENT_ID $CALCUL_URL $CALCUL_AUDIENCE $CALCUL_API_CLIENT_ID $MCP_APP_FQDN $CLUSTER_APP_FQDN $INSURFLOW_CLUSTER_CLIENT_ID $RAG_APP_FQDN $LLM_AUDIENCE $LLM_API_CLIENT_ID $FOUNDRY_ENDPOINT' \
            < infra/containerapp.yaml > "$RUNNER_TEMP/containerapp.yaml"
          az containerapp update -n "$APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp.yaml" -o none
          # Production : le domaine personnalisé (G4, #12) dès que PROD_URL est posée ; la fumée
          # vérifie alors aussi son certificat (curl sans -k)
          url="${{ inputs.environnement == 'production' && vars.PROD_URL || '' }}"
          [ -n "$url" ] || url="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Identité managée conservée par l'update --yaml (lecture seule, porte bloquante)
        env:
          UAMI: ${{ vars.AZURE_UAMI_CLIENT_ID }}
        run: |
          app=$(az containerapp show -n "$APP" -g "$RG" -o json)
          jq -e --arg u "$UAMI" '[.identity.userAssignedIdentities // {} | .[] | .clientId] | index($u)' <<<"$app" > /dev/null ||
            { echo "::error::identité managée $UAMI absente de $APP après l'update (OBO de rag impossible)"; exit 1; }
          jq -e '.properties.configuration.ingress.external == true' <<<"$app" > /dev/null ||
            { echo "::error::$APP : la gateway doit rester la seule entrée externe"; exit 1; }
          echo "✔ identité managée de la gateway conservée"

      # rag après la base annexe et la principale : il joue ses migrations (demarrer.sh) sur le postgres neuf du même déploiement.
      # Il parle à la gateway (LLM, dossiers, traces) seulement à la requête : la gateway n'a pas à le précéder.
      - name: Déployer rag (modèle infra/containerapp-rag.yaml, Container App interne, identité managée propre)
        env:
          IMAGE_RAG: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow-rag:${{ steps.image.outputs.tag }}
          APP_ENV: ${{ inputs.environnement }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          RAG_API_CLIENT_ID: ${{ vars.RAG_API_CLIENT_ID }}
          UNDERWRITING_API_CLIENT_ID: ${{ vars.UNDERWRITING_API_CLIENT_ID }}
          RAG_SEUIL: ${{ vars.RAG_SEUIL }}
          LLM_AUDIENCE: ${{ vars.LLM_AUDIENCE }}
          AZURE_UAMI_RAG_CLIENT_ID: ${{ vars.AZURE_UAMI_RAG_CLIENT_ID }}
        run: |
          GATEWAY_URL="https://$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          # PG_HOST : le nom de la Container App postgres, résolu dans l'environnement (TCP interne 5432)
          PG_HOST="$PG_APP"
          export GATEWAY_URL PG_HOST
          # shellcheck disable=SC2016 # envsubst reçoit les noms des variables, pas leurs valeurs
          envsubst '$IMAGE_RAG $APP_ENV $AZURE_TENANT_ID $RAG_API_CLIENT_ID $UNDERWRITING_API_CLIENT_ID $RAG_SEUIL $LLM_AUDIENCE $AZURE_UAMI_RAG_CLIENT_ID $GATEWAY_URL $PG_HOST' \
            < infra/containerapp-rag.yaml > "$RUNNER_TEMP/containerapp-rag.yaml"
          az containerapp update -n "$RAG_APP" -g "$RG" --yaml "$RUNNER_TEMP/containerapp-rag.yaml" -o none
          rag=$(az containerapp show -n "$RAG_APP" -g "$RG" -o json)
          jq -e --arg u "$AZURE_UAMI_RAG_CLIENT_ID" '[.identity.userAssignedIdentities // {} | .[] | .clientId | ascii_downcase] | index($u | ascii_downcase)' <<<"$rag" > /dev/null ||
            { echo "::error::identité managée $AZURE_UAMI_RAG_CLIENT_ID absente de $RAG_APP après l'update (OBO et jeton LLM de rag impossibles)"; exit 1; }
          jq -e '.properties.configuration.ingress.external == false' <<<"$rag" > /dev/null ||
            { echo "::error::$RAG_APP exposé hors de l'environnement : l'entrée doit rester interne"; exit 1; }
          for secret in pg-migrateur-password pg-writer-password pg-reader-password; do
            jq -e --arg s "$secret" '[.properties.configuration.secrets[]?.name] | index($s)' <<<"$rag" > /dev/null ||
              { echo "::error::secret $secret perdu par l'update de $RAG_APP (relancer infra/postgres-annexe.sh)"; exit 1; }
          done
          echo "✔ $RAG_APP déployé, entrée interne, identité managée propre posée, 3 secrets pg-* conservés"

      - name: Fumée par la gateway — bonnes versions (dont le MCP interne et la Function), API fermée sans jeton (porte bloquante)
        env:
          URL: ${{ steps.deployer.outputs.url }}
          attendu: ${{ steps.image.outputs.tag }}
        run: |
          # démarrage des nouvelles révisions : rag et underwriting-admin (leurs Container Apps) jouent leurs migrations avant d'écouter ;
          # le cluster charge ses modèles LLM Guard (/health 503 jusque-là, image ≈ 9 Go à tirer) : jusqu'à 5 min
          for _ in $(seq 1 60); do
            version=$(curl -fsS "$URL/health" | jq -r .version) || version=""
            version_rag=$(curl -fsS "$URL/health/rag" | jq -r .version) || version_rag=""
            version_uw=$(curl -fsS "$URL/health/underwriting" | jq -r .version) || version_uw=""
            version_mcp=$(curl -fsS "$URL/health/mcp" | jq -r .version) || version_mcp=""
            version_calcul=$(curl -fsS "$URL/health/calcul" | jq -r .version) || version_calcul=""
            version_cluster=$(curl -fsS "$URL/health/cluster" | jq -r .version) || version_cluster=""
            [ "$version" = "$attendu" ] && [ "$version_rag" = "$attendu" ] && [ "$version_uw" = "$attendu" ] && [ "$version_mcp" = "$attendu" ] && [ "$version_calcul" = "$attendu" ] && [ "$version_cluster" = "$attendu" ] && break
            sleep 5
          done
          [ "$version" = "$attendu" ] || { echo "::error::gateway : version '$version' ≠ '$attendu'"; exit 1; }
          [ "$version_rag" = "$attendu" ] || { echo "::error::rag : version '$version_rag' ≠ '$attendu'"; exit 1; }
          [ "$version_uw" = "$attendu" ] || { echo "::error::underwriting-admin : version '$version_uw' ≠ '$attendu'"; exit 1; }
          [ "$version_mcp" = "$attendu" ] || { echo "::error::serveur-mcp : version '$version_mcp' ≠ '$attendu'"; exit 1; }
          [ "$version_calcul" = "$attendu" ] || { echo "::error::calcul (par la gateway) : version '$version_calcul' ≠ '$attendu'"; exit 1; }
          [ "$version_cluster" = "$attendu" ] || { echo "::error::cluster d'agents : version '$version_cluster' ≠ '$attendu'"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/souscriptions/AIF-2026-000001/evaluation")
          [ "$code" = 401 ] || { echo "::error::POST /v1/souscriptions/{n}/evaluation sans jeton : $code ≠ 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/reponses" -H 'content-type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "::error::POST /api/reponses sans jeton : $code ≠ 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/calcul/evaluer" -H 'content-type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "::error::POST /api/calcul/evaluer sans jeton : $code ≠ 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/llm/v1/chat/completions" -H 'content-type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "::error::POST /api/llm/v1/chat/completions sans jeton : $code ≠ 401"; exit 1; }
          # Le LLM avec jeton (rôle LLM de rag) est vérifié par le job evals (staging), via /api/reponses
          echo "✔ $URL : gateway, rag, underwriting-admin, serveur-mcp, calcul et cluster en $attendu, /api/reponses, /api/calcul, /api/llm et /v1/souscriptions fermées sans jeton"

      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }

      - name: Corpus — base annexe éphémère, chaque révision (déploiement ou rollback) repart vide
        # dernier instantané versionné, rejoué par la gateway ; jeton az de la CI (rôle Ingestion)
        env:
          URL: ${{ steps.deployer.outputs.url }}
          APP_ENV: ${{ inputs.environnement }}
        run: |
          make install
          make ingest URL="$URL" INSTANTANE="$(ls data/raw/code-assurances-*.json | sort | tail -1)"
