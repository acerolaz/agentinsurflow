# Chaîne du socle (CI/CD/Evals)
#   PR    : lint → test → [evals-pr]                       (portes exigées par la protection de main)
#   merge : lint → test → build → staging (+ fumée) → [evals] → release → production (+ fumée)
# [evals…] ne tournent QUE si le prompt, le golden dataset ou la version du LLM changent
# (job changements) ; sinon ils sont sautés et la chaîne continue.
# Deux versions (tools/version.py) : l'artefact X.Y.Z-build.N (image, /health) à chaque build,
# la release vX.Y.Z (tag Git) posée sur le commit juste avant la production.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fichiers qui peuvent changer le résultat des évaluations
  DECLENCHEURS_EVALS: '^(agentinsurflow/prompts/|eval/golden\.jsonl$|llm\.env$)'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - run: make install
      - run: make lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - run: make install
      - run: make test # LLM mocké : aucun appel réel

  changements:
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prompt, golden dataset ou version du LLM modifiés ?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # base introuvable (1er push d'une branche…) : on évalue, par prudence
          if ! fichiers=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            echo "evals=true" >> "$GITHUB_OUTPUT"; echo "Base introuvable : évaluations lancées"; exit 0
          fi
          declencheurs=$(echo "$fichiers" | grep -E "$DECLENCHEURS_EVALS" || true)
          echo "evals=$([ -n "$declencheurs" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Déclencheurs modifiés : ${declencheurs:-aucun}"

  evals-pr:
    needs: [test, changements]
    if: github.event_name == 'pull_request' && needs.changements.outputs.evals == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - uses: azure/login@v2 # OIDC : le jeton Entra sert aussi à appeler le LLM, sans clé
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # seul un rôle sur la ressource Foundry est nécessaire
      - run: make install
      - name: Golden set contre l'API de la PR, LLM réel (porte bloquante avant merge)
        run: |
          uv run uvicorn agentinsurflow.api:app --port 8000 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          uv run python tools/evals.py --url http://127.0.0.1:8000 --rapport evals-pr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-pr-${{ github.event.pull_request.head.sha }}
          path: evals-pr.json
          if-no-files-found: error

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version de l'artefact (pyproject + n° de run)
        id: version
        run: echo "version=$(python3 tools/version.py)-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2 # OIDC : aucun secret de longue durée
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construire et publier l'image (tag = version de l'artefact, immuable)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/agentinsurflow:${{ steps.version.outputs.version }}
        run: |
          # Relance du run : même version, déjà publiée → on ne l'écrase pas
          if az acr repository show -n "${{ vars.ACR_NAME }}" --image "agentinsurflow:$VERSION" -o none 2>/dev/null; then
            echo "Image $VERSION déjà publiée"; exit 0
          fi
          az acr login -n "${{ vars.ACR_NAME }}"
          docker build --build-arg APP_VERSION="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

  staging:
    needs: build
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/deploy.yml
    with: { environnement: staging, tag: "${{ needs.build.outputs.version }}" }
    secrets: inherit

  evals:
    needs: [staging, changements]
    if: needs.changements.outputs.evals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden set contre staging (porte bloquante, aucun secret)
        run: python3 tools/evals.py --url "${{ needs.staging.outputs.url }}" --rapport evals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-staging-${{ github.sha }}
          path: evals.json
          if-no-files-found: error

  release:
    needs: [build, changements, staging, evals]
    # evals sautées (rien à évaluer) = feu vert ; evals en échec = ni tag ni production
    if: >-
      ${{ !cancelled() && needs.changements.result == 'success'
      && needs.staging.result == 'success' && needs.evals.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: { contents: write } # pousser le tag
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tous les tags, pour calculer Z
      - name: Tagger le commit vX.Y.Z (avant la production)
        env:
          ARTEFACT: ${{ needs.build.outputs.version }}
        run: |
          tag=$(python3 tools/version.py --release)
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag — image agentinsurflow:$ARTEFACT"
            git push origin "$tag"
          fi
          echo "✔ release $tag → image $ARTEFACT" | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    needs: [build, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/deploy.yml
    with: { environnement: production, tag: "${{ needs.build.outputs.version }}" }
    secrets: inherit
