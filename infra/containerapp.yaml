# Container App : modèle versionné (G5, S3-19, S3-30). deploy.yml y substitue les variables (envsubst),
# puis `az containerapp update --yaml`. Seul `template` est fourni : l'entrée (port 8000, gateway),
# le registre et l'identité managée (infra/entra.sh) restent tels quels.
# Cette Container App ne contient que la gateway (seule exposée). underwriting-admin, le serveur MCP, rag et la base
# annexe ont chacun la leur, entrée interne (infra/containerapp-underwriting.yaml, -mcp.yaml, -rag.yaml, -postgres.yaml).
properties:
  template:
    scale:
      minReplicas: 1 # la gateway est le point d'entrée : jamais à froid
      maxReplicas: 1
    containers:
      - name: gateway
        image: ${IMAGE_GATEWAY}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          - { name: APPLICATIONINSIGHTS_CONNECTION_STRING, secretRef: appinsights-connection }
          - { name: Proxy__EnvoyDevant, value: "true" }
          - { name: Entra__TenantId, value: "${AZURE_TENANT_ID}" }
          - { name: Entra__Audiences__rag__0, value: api://agentinsurflow-rag }
          - { name: Entra__Audiences__rag__1, value: "${RAG_API_CLIENT_ID}" }
          - { name: Entra__Audiences__underwriting__0, value: api://agentinsurflow-underwriting }
          - { name: Entra__Audiences__underwriting__1, value: "${UNDERWRITING_API_CLIENT_ID}" }
          - { name: Entra__Audiences__mcp__0, value: api://agentinsurflow-mcp }
          - { name: Entra__Audiences__mcp__1, value: "${MCP_API_CLIENT_ID}" }
          - { name: Entra__McpClientId, value: "${MCP_API_CLIENT_ID}" } # azp des jetons OBO du MCP : seul appelant de PUT …/etat
          - { name: Entra__Audiences__cluster__0, value: api://agentinsurflow-cluster }
          - { name: Entra__Audiences__cluster__1, value: "${INSURFLOW_CLUSTER_CLIENT_ID}" }
          - { name: Entra__ClusterClientId, value: "${INSURFLOW_CLUSTER_CLIENT_ID}" } # azp des jetons du cluster : seul appelant de /api/points-de-reprise/**
          - { name: Entra__Audiences__calcul__0, value: "${CALCUL_AUDIENCE}" }
          - { name: Entra__Audiences__calcul__1, value: "${CALCUL_API_CLIENT_ID}" }
          # LLM par la gateway (#70) : rôle LLM + audience api://<appId llm> (__0) et GUID (__1, jetons v2)
          - { name: Entra__Audiences__llm__0, value: "${LLM_AUDIENCE}" }
          - { name: Entra__Audiences__llm__1, value: "${LLM_API_CLIENT_ID}" }
          # Foundry (clés désactivées) : la gateway échange le jeton de l'appelant contre le sien (identité managée, rôle OpenAI User)
          - { name: ReverseProxy__Clusters__llm__Destinations__d1__Address, value: "${FOUNDRY_ENDPOINT}" }
          - { name: Llm__Portee, value: "https://cognitiveservices.azure.com/.default" }
          - { name: ReverseProxy__Clusters__calcul__Destinations__d1__Address, value: "${CALCUL_URL}" }
          # échange de jeton vers la Function : identité managée partagée (Easy Auth n'accepte que son client id)
          - { name: Calcul__Portee, value: "${CALCUL_AUDIENCE}/.default" }
          - { name: Calcul__IdentiteClientId, value: "${AZURE_UAMI_CLIENT_ID}" }
          # rag, underwriting-admin, serveur MCP et cluster d'agents : Container Apps internes du même environnement (FQDN lus par deploy.yml)
          - { name: ReverseProxy__Clusters__underwriting__Destinations__d1__Address, value: "https://${UNDERWRITING_APP_FQDN}" }
          - { name: ReverseProxy__Clusters__rag__Destinations__d1__Address, value: "https://${RAG_APP_FQDN}" }
          - { name: ReverseProxy__Clusters__mcp__Destinations__d1__Address, value: "https://${MCP_APP_FQDN}" }
          # cluster d'agents (#7) : relais du jeton du gestionnaire, qu'il revalide (R18)
          - { name: ReverseProxy__Clusters__cluster__Destinations__d1__Address, value: "https://${CLUSTER_APP_FQDN}" }
          # ponytail: la page Swagger se connecte avec l'inscription de rag (A3 : pas d'inscription gateway)
          - { name: SWAGGER_CLIENT_ID, value: "${RAG_API_CLIENT_ID}" }
          # espace gestionnaire /app/ (#103) : même client public ; portées des services ; UPN de connexion (loginHint), sans secret
          - { name: Espace__Authority, value: "https://login.microsoftonline.com/${AZURE_TENANT_ID}" }
          - { name: Espace__Scopes__Rag, value: api://agentinsurflow-rag/access_as_user }
          - { name: Espace__Scopes__Underwriting, value: api://agentinsurflow-underwriting/access_as_user }
          - { name: Espace__Scopes__Cluster, value: api://agentinsurflow-cluster/access_as_user }
          - { name: Espace__Comptes__A, value: "${ESPACE_COMPTE_A}" }
          - { name: Espace__Comptes__B, value: "${ESPACE_COMPTE_B}" }
          # traces : récepteur OTLP d'underwriting-admin (adresse interne), jeton d'application de la gateway (rôle Telemetrie)
          - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "https://${UNDERWRITING_APP_FQDN}/v1/traces" }
          - { name: Telemetrie__Audience, value: "api://${UNDERWRITING_API_CLIENT_ID}" }
