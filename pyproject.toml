[project]
name = "agentinsurflow"
version = "0.5.0" # version de la solution (tools/version.py → tag de release vX.Y.Z)
description = "AgentInsurFlow (monorepo) : gateway, rag, underwriting-admin, et leur chaîne."
requires-python = ">=3.12,<3.13"
dependencies = ["agentinsurflow-rag"]

[tool.uv]
package = false # racine de l'espace de travail : outillage commun (tools/, e2e/), pas de paquet

[tool.uv.workspace]
members = ["rag"]

[tool.uv.sources]
agentinsurflow-rag = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
# tests/ : outillage de la racine (tools/) ; rag/tests : le service rag (unit = TU, integration = TI)
testpaths = ["tests", "rag/tests"]
pythonpath = [".", "rag/tests"]
addopts = "--cov=agentinsurflow_rag --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.report]
# Porte bloquante = borne basse de la fourchette 80–83 % (dossier-conception-v1.md, P4)
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentinsurflow_rag",
    "tools",
    "fakes",
    "jetons_de_test",
    "test_reponses_api",
    "corpus_de_test",
    "conftest",
]

[tool.mypy]
python_version = "3.12"
strict = true
