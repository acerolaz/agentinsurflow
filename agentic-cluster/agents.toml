# Réglage des sous-agents du cluster (la Saga n'a pas de LLM). Modifié par PR ; lu au démarrage.
[pieces]
modele = "gpt-4.1-mini"      # nom du déploiement Foundry
temperature = 0.0            # [0, 1]
max_tokens = 400             # par appel, réponse seule
delai_s = 1.5                # garde de l'agent (référence + LLM)
prompt = "pieces.md"         # prompt système, dans infrastructure/llm/prompts/

[analyste]
modele = "gpt-4.1-mini"
temperature = 0.0
max_tokens = 400
delai_s = 2.0
prompt = "analyste.md"

[redacteur]
modele = "gpt-4.1-mini"
temperature = 0.2
max_tokens = 1200
delai_s = 8.0
prompt = "redacteur.md"

[actuaire]
modele = "gpt-4.1-mini"
temperature = 0.0
max_tokens = 400
delai_s = 1.5
prompt = "actuaire.md"
