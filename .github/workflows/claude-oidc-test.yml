name: anthropic-wif-test
on: push

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for an Anthropic access token
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01DMWmGXpDkisx8JTuxRduGw",
            "organization_id": "6c1e6c73-1d80-4062-8f2a-339aaf3d91ab",
            "service_account_id": "svac_01K9kFZ5wZugqPw4KDcvJ1Ae",
            "workspace_id": "wrkspc_01BiHtx17YWhk55heVLKjjzX"
          }
          JSON
