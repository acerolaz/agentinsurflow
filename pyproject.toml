[project]
name = "agentinsurflow"
version = "0.6.0" # version de la solution (tools/version.py → tag de release vX.Y.Z)
description = "AgentInsurFlow (monorepo) : gateway, rag, underwriting-admin, et leur chaîne."
requires-python = ">=3.12,<3.13"
dependencies = ["agentinsurflow-rag", "agentinsurflow-mcp", "agentinsurflow-calcul", "agentinsurflow-cluster"]

[tool.uv]
package = false # racine de l'espace de travail : outillage commun (tools/, e2e/), pas de paquet
# llm-guard 0.3.16 épingle presidio 2.2.358 et regex 2024.11.6 (et fait rétrograder cryptography) :
# décision d'Acerola du 23/10, aucune rétrogradation, on force les versions du lock actuel.
override-dependencies = ["cryptography==50.0.2", "regex==2026.9.29"]

[tool.uv.workspace]
members = ["rag", "serveur-mcp", "fonction-calcul", "agentic-cluster"]

[tool.uv.sources]
agentinsurflow-rag = { workspace = true }
agentinsurflow-mcp = { workspace = true }
agentinsurflow-calcul = { workspace = true }
agentinsurflow-cluster = { workspace = true }
# décision d'Acerola du 23/10 : image sans CUDA, même version de torch que le lock, build CPU
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
# tests/ : outillage de la racine (tools/) ; rag/tests : le service rag (unit = TU, integration = TI)
testpaths = ["tests", "rag/tests", "serveur-mcp/tests", "fonction-calcul/tests", "agentic-cluster/tests"]
pythonpath = [".", "fonction-calcul", "rag/tests", "serveur-mcp/tests", "fonction-calcul/tests", "agentic-cluster/tests"]
addopts = "-m 'not lent' --cov=agentinsurflow_rag --cov=agentinsurflow_mcp --cov=agentinsurflow_calcul --cov=agentinsurflow_cluster --cov=function_app --cov-report=term-missing"
markers = ["lent: TI qui charge de vrais modèles (LLM Guard, Hugging Face) ; exclu par défaut, lancer avec -m lent"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.report]
# Porte bloquante = borne basse de la fourchette 80–83 % (dossier-conception-v1.md, P4)
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentinsurflow_rag",
    "agentinsurflow_mcp",
    "agentinsurflow_calcul",
    "agentinsurflow_cluster",
    "tools",
    "fakes",
    "jetons_de_test",
    "test_reponses_api",
    "corpus_de_test",
    "conftest",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["llm_guard.*"]  # LLM Guard n'est pas typé (pas de py.typed)
ignore_missing_imports = true
