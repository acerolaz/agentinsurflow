# Container App : modèle versionné (G5, S3-19, S3-30). deploy.yml y substitue les variables (envsubst),
# puis `az containerapp update --yaml`. Seul `template` est fourni : l'entrée (port 8000, gateway),
# le registre et les secrets posés à la main (infra/postgres-annexe.sh) restent tels quels
# (🔴 Z4 : conservation des secrets à vérifier au premier déploiement en staging).
# Les conteneurs partagent localhost : gateway 8000 (seule exposée), rag 8001, underwriting-admin 8002 et serveur-mcp 8003 (internes), postgres 5432.
properties:
  template:
    scale:
      minReplicas: 1 # base annexe éphémère : une seule réplique, toujours allumée
      maxReplicas: 1
    containers:
      - name: gateway
        image: ${IMAGE_GATEWAY}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          - { name: Proxy__EnvoyDevant, value: "true" }
          - { name: Entra__TenantId, value: "${AZURE_TENANT_ID}" }
          - { name: Entra__Audiences__rag__0, value: api://agentinsurflow-rag }
          - { name: Entra__Audiences__rag__1, value: "${RAG_API_CLIENT_ID}" }
          - { name: Entra__Audiences__underwriting__0, value: api://agentinsurflow-underwriting }
          - { name: Entra__Audiences__underwriting__1, value: "${UNDERWRITING_API_CLIENT_ID}" }
          - { name: Entra__Audiences__mcp__0, value: api://agentinsurflow-mcp }
          - { name: Entra__Audiences__mcp__1, value: "${MCP_API_CLIENT_ID}" }
          - { name: Entra__Audiences__calcul__0, value: "${CALCUL_AUDIENCE}" }
          - { name: ReverseProxy__Clusters__calcul__Destinations__d1__Address, value: "${CALCUL_URL}" }
          # ponytail: la page Swagger se connecte avec l'inscription de rag (A3 : pas d'inscription gateway)
          - { name: SWAGGER_CLIENT_ID, value: "${RAG_API_CLIENT_ID}" }
          # traces : récepteur OTLP d'underwriting-admin (loopback, sans jeton : règle S3-21)
          - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://localhost:8002/v1/traces" }
      - name: rag
        image: ${IMAGE_RAG}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          # Aucune clé : le modèle est appelé avec l'identité managée (Cognitive Services User)
          - { name: APP_ENV, value: "${APP_ENV}" }
          - { name: AZURE_OPENAI_ENDPOINT, value: "${AZURE_OPENAI_ENDPOINT}" }
          - { name: AZURE_TENANT_ID, value: "${AZURE_TENANT_ID}" }
          - { name: RAG_API_CLIENT_ID, value: "${RAG_API_CLIENT_ID}" }
          # même liste que la gateway (Entra__Audiences__rag__0 et __1)
          - { name: RAG_API_AUDIENCES, value: "api://agentinsurflow-rag,${RAG_API_CLIENT_ID}" }
          - { name: RAG_SEUIL, value: "${RAG_SEUIL}" } # vide → avertissement, /api/extraits en 503
          - { name: PG_HOST, value: localhost }
          # migrateur : au démarrage seulement (demarrer.sh), retiré avant uvicorn
          - { name: PG_MIGRATEUR_PASSWORD, secretRef: pg-migrateur-password }
          - { name: PG_WRITER_PASSWORD, secretRef: pg-writer-password }
          - { name: PG_READER_PASSWORD, secretRef: pg-reader-password }
          - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://localhost:8002/v1/traces" }
          # dossiers : On-Behalf-Of, PAR LA GATEWAY (D22 : rôle par route, débit) ; identité managée fédérée (A7)
          - { name: UNDERWRITING_URL, value: "http://localhost:8000" }
          - { name: UNDERWRITING_API_CLIENT_ID, value: "${UNDERWRITING_API_CLIENT_ID}" }
          - { name: AZURE_UAMI_CLIENT_ID, value: "${AZURE_UAMI_CLIENT_ID}" }
      - name: serveur-mcp
        image: ${IMAGE_MCP}
        resources: { cpu: 0.5, memory: 1Gi }
        # port 8003 : jamais d'entrée externe, seule la gateway (localhost) l'appelle
        probes:
          - { type: Liveness, httpGet: { path: /health, port: 8003 }, initialDelaySeconds: 10, periodSeconds: 10 }
          - { type: Readiness, httpGet: { path: /health, port: 8003 }, initialDelaySeconds: 5, periodSeconds: 5 }
        env:
          # Aucun secret : OBO par l'identité managée fédérée (AZURE_UAMI_CLIENT_ID), jamais MCP_CLIENT_SECRET
          - { name: APP_ENV, value: "${APP_ENV}" }
          - { name: AZURE_TENANT_ID, value: "${AZURE_TENANT_ID}" }
          - { name: MCP_API_CLIENT_ID, value: "${MCP_API_CLIENT_ID}" }
          # même liste que la gateway (Entra__Audiences__mcp__0 et __1)
          - { name: MCP_API_AUDIENCES, value: "api://agentinsurflow-mcp,${MCP_API_CLIENT_ID}" }
          # azp des agents (matrice d'accès) : inscriptions de #7, à poser en variables GitHub ensuite
          - { name: MCP_AZP_ORCHESTRATEUR, value: "${MCP_AZP_ORCHESTRATEUR}" }
          - { name: MCP_AZP_REDACTEUR, value: "${MCP_AZP_REDACTEUR}" }
          - { name: MCP_AZP_ACTUAIRE, value: "${MCP_AZP_ACTUAIRE}" }
          - { name: RAG_API_CLIENT_ID, value: "${RAG_API_CLIENT_ID}" }
          - { name: UNDERWRITING_API_CLIENT_ID, value: "${UNDERWRITING_API_CLIENT_ID}" }
          - { name: AZURE_UAMI_CLIENT_ID, value: "${AZURE_UAMI_CLIENT_ID}" }
          # rag et dossiers : PAR LA GATEWAY (D22)
          - { name: GATEWAY_URL, value: "http://localhost:8000" }
          # calcul : appel direct de la Function (jeton de l'identité managée), seconde exception à D22
          - { name: CALCUL_URL, value: "${CALCUL_URL}" }
          - { name: CALCUL_AUDIENCE, value: "${CALCUL_AUDIENCE}" }
          - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://localhost:8002/v1/traces" }
      - name: underwriting-admin
        image: ${IMAGE_UNDERWRITING}
        resources: { cpu: 0.5, memory: 1Gi }
        # port 8002 : jamais d'entrée externe, seule la gateway (localhost) l'appelle
        probes:
          - { type: Liveness, httpGet: { path: /health, port: 8002 }, initialDelaySeconds: 10, periodSeconds: 10 }
          - { type: Readiness, httpGet: { path: /health, port: 8002 }, initialDelaySeconds: 5, periodSeconds: 5 }
        env:
          - { name: AzureAd__TenantId, value: "${AZURE_TENANT_ID}" }
          - { name: AzureAd__ClientId, value: "${UNDERWRITING_API_CLIENT_ID}" }
          # même liste que la gateway (Entra__Audiences__underwriting__0 et __1)
          - { name: Entra__Audiences__underwriting__0, value: "api://agentinsurflow-underwriting,${UNDERWRITING_API_CLIENT_ID}" }
          # schémas et seed au démarrage (migrateur) ; Otlp__SourcesSansJeton : défaut, loopback seule
          - { name: Migrations__AuDemarrage, value: "true" }
          - { name: PG_HOST, value: localhost }
          - { name: PG_MIGRATEUR_PASSWORD, secretRef: pg-migrateur-password }
          - { name: PG_DOSSIERS_PASSWORD, secretRef: pg-dossiers-password }
          - { name: PG_TRACES_WRITER_PASSWORD, secretRef: pg-traces-writer-password }
          - { name: PG_TRACES_READER_PASSWORD, secretRef: pg-traces-reader-password }
          # oid des deux gestionnaires de test (variables GitHub, pas des secrets)
          - { name: SEED_GESTIONNAIRE_A, value: "${SEED_GESTIONNAIRE_A}" }
          - { name: SEED_GESTIONNAIRE_B, value: "${SEED_GESTIONNAIRE_B}" }
      - name: postgres
        image: ${IMAGE_POSTGRES}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          - { name: POSTGRES_PASSWORD, secretRef: pg-postgres-password }
          - { name: PG_MIGRATEUR_PASSWORD, secretRef: pg-migrateur-password }
          - { name: PG_WRITER_PASSWORD, secretRef: pg-writer-password }
          - { name: PG_READER_PASSWORD, secretRef: pg-reader-password }
          - { name: PG_DOSSIERS_PASSWORD, secretRef: pg-dossiers-password }
          - { name: PG_TRACES_WRITER_PASSWORD, secretRef: pg-traces-writer-password }
          - { name: PG_TRACES_READER_PASSWORD, secretRef: pg-traces-reader-password }
