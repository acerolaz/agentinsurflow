[project]
name = "agentinsurflow-rag"
version = "0.2.0"
description = "AgentInsurFlow — rag : corpus Légifrance, recherche hybride et agent à réponses citées."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic-settings>=2.4",
    "azure-identity>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentinsurflow_rag"]
