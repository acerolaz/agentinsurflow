# Container App de la base PostgreSQL annexe (#70) : modèle versionné, substitué par deploy.yml (envsubst) puis
# `az containerapp update --yaml`. Seul `template` est fourni : l'entrée TCP INTERNE (5432, exposedPort 5432, posée
# par infra/bootstrap.sh), le registre et les secrets pg-* (infra/postgres-annexe.sh) restent tels quels.
# Joignable par les autres Container Apps du même environnement, à l'adresse = le nom de l'app (PG_HOST).
# Base ÉPHÉMÈRE, comme avant : aucun volume ; DEPLOIEMENT change à chaque déploiement, donc chaque déploiement
# crée une nouvelle révision et une base vide (rag et underwriting-admin rejouent leurs migrations, puis le corpus
# est réingéré). Une réplique, jamais de montée en charge : un second postgres serait une seconde base vide.
properties:
  template:
    scale:
      minReplicas: 1
      maxReplicas: 1
    containers:
      - name: postgres
        image: ${IMAGE_POSTGRES}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          - { name: DEPLOIEMENT, value: "${TAG}" }
          - { name: POSTGRES_PASSWORD, secretRef: pg-postgres-password }
          - { name: PG_MIGRATEUR_PASSWORD, secretRef: pg-migrateur-password }
          - { name: PG_WRITER_PASSWORD, secretRef: pg-writer-password }
          - { name: PG_READER_PASSWORD, secretRef: pg-reader-password }
          - { name: PG_DOSSIERS_PASSWORD, secretRef: pg-dossiers-password }
          - { name: PG_TRACES_WRITER_PASSWORD, secretRef: pg-traces-writer-password }
          - { name: PG_TRACES_READER_PASSWORD, secretRef: pg-traces-reader-password }
          - { name: PG_POINTS_REPRISE_PASSWORD, secretRef: pg-points-reprise-password }
