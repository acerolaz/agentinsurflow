# Container App du cluster d'agents (#7, T12) : modèle versionné, substitué par deploy.yml (envsubst) puis
# `az containerapp update --yaml`. Seul `template` est fourni : l'entrée INTERNE (port 8004, posée par
# infra/bootstrap.sh), le registre, l'identité managée PROPRE uami-insurflow-cluster (infra/entra.sh ⑧) et le
# secret checkpoint-dsn (infra/postgres-annexe.sh) restent tels quels.
# Joignable seulement par la gateway (https://<app>.internal.<domaine de l'environnement>) ; « n'accepte que la
# gateway » (D105) = entrée interne + revalidation du jeton du gestionnaire relayé par la gateway (R18), pas azp.
# Il joint le MCP et le LLM par la gateway seulement (D22) : GATEWAY_URL, jamais une adresse interne.
properties:
  template:
    scale:
      # Le verrou par dossier (asyncio.Lock) ne vaut que pour une réplique (R17) : jamais plus d'une.
      # Jamais à froid non plus : le chargement des modèles LLM Guard prend des secondes.
      minReplicas: 1
      maxReplicas: 1
    containers:
      - name: agentic-cluster
        image: ${IMAGE_CLUSTER}
        # torch CPU + ≈ 2,5 Go de modèles LLM Guard chargés en mémoire + graphe LangGraph : 4 Gio de mémoire
        # (la plus petite combinaison du profil Consommation au-dessus de ≈ 3,5 Gio utiles) et 2 vCPU
        # (l'inférence des scanners est sur le chemin critique de chaque évaluation, budget global 25 s).
        resources: { cpu: 2.0, memory: 4Gi }
        probes:
          # /health répond 503 tant que les scanners ne sont pas chargés (≈ 6 s en local, davantage sur 2 vCPU
          # partagés) : le démarrage a 30 s + 10 × 15 s (≈ 3 min, failureThreshold plafonné à 10) ; la vivacité ne court qu'ensuite
          - { type: Startup, httpGet: { path: /health, port: 8004 }, initialDelaySeconds: 30, periodSeconds: 15, failureThreshold: 10 }
          - { type: Liveness, httpGet: { path: /health, port: 8004 }, periodSeconds: 15, failureThreshold: 4 }
          - { type: Readiness, httpGet: { path: /health, port: 8004 }, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 6 }
        env:
          - { name: APPLICATIONINSIGHTS_CONNECTION_STRING, secretRef: appinsights-connection }
          # Aucun secret client : OBO et jetons d'application par l'identité managée PROPRE du cluster (fédérée sur
          # l'application du cluster et sur chaque agent), jamais INSURFLOW_CLIENT_SECRET
          - { name: APP_ENV, value: "${APP_ENV}" }
          - { name: AZURE_TENANT_ID, value: "${AZURE_TENANT_ID}" }
          - { name: AZURE_UAMI_CLIENT_ID, value: "${AZURE_UAMI_CLUSTER_CLIENT_ID}" }
          # MCP et LLM : TOUJOURS par la gateway (D22)
          - { name: GATEWAY_URL, value: "${GATEWAY_URL}" }
          - { name: MCP_API_CLIENT_ID, value: "${MCP_API_CLIENT_ID}" }
          - { name: UNDERWRITING_API_CLIENT_ID, value: "${UNDERWRITING_API_CLIENT_ID}" }
          - { name: LLM_AUDIENCE, value: "${LLM_AUDIENCE}" }
          - { name: INSURFLOW_LLM_ACTIF, value: "true" }
          # application du cluster (audience de l'API et 1er saut OBO) puis une application par agent (azp du jeton final)
          - { name: INSURFLOW_CLUSTER_CLIENT_ID, value: "${INSURFLOW_CLUSTER_CLIENT_ID}" }
          - { name: INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID, value: "${INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID}" }
          - { name: INSURFLOW_AGENT_PIECES_CLIENT_ID, value: "${INSURFLOW_AGENT_PIECES_CLIENT_ID}" }
          - { name: INSURFLOW_AGENT_ANALYSTE_CLIENT_ID, value: "${INSURFLOW_AGENT_ANALYSTE_CLIENT_ID}" }
          - { name: INSURFLOW_AGENT_REDACTEUR_CLIENT_ID, value: "${INSURFLOW_AGENT_REDACTEUR_CLIENT_ID}" }
          - { name: INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID, value: "${INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID}" }
          - { name: INSURFLOW_BUDGET_S, value: "25" }
          - { name: INSURFLOW_RESERVE_S, value: "2" }
          # points de reprise : DSN du compte agent_state (schéma agent_state seul, base dossiers), secret de l'app
          - { name: INSURFLOW_CHECKPOINT_DSN, secretRef: checkpoint-dsn }
          # Traces (R19), comme le serveur MCP : par la gateway (/v1/traces), jeton d'application de l'inscription du
          # cluster, rôle Telemetrie d'underwriting-admin (infra/entra.sh ⑧)
          - { name: TELEMETRIE_AUDIENCE, value: "api://${UNDERWRITING_API_CLIENT_ID}" }
          - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "${GATEWAY_URL}/v1/traces" }
          - { name: OTEL_SERVICE_NAME, value: "agentic-cluster" }
