[project]
name = "agentinsurflow"
version = "0.1.0"
description = "Socle AgentInsurFlow : API FastAPI + interface minimale + un appel LLM, livré par la chaîne."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic-settings>=2.4",
    "azure-identity>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentinsurflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=agentinsurflow --cov-report=term-missing"

[tool.coverage.report]
# Porte bloquante = borne basse de la fourchette 80–83 % (dossier-conception-v1.md, P4)
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
