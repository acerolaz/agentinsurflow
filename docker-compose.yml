# Solution en local : make up (tout) · make test-integration (postgres seul).
# Mots de passe et identifiants lus dans .env (jamais versionné ; clés dans .env.example).
# Swagger unique : http://localhost:8000/ (gateway) ; rag seul : http://localhost:8001/
# serveur-mcp (:8003) : joignable par la gateway (/mcp). underwriting-admin (:8002) : joignable par la gateway (/api/contrats, /api/traces, /v1/traces).
name: agentinsurflow

x-mots-de-passe: &mots-de-passe
  PG_MIGRATEUR_PASSWORD: ${PG_MIGRATEUR_PASSWORD:?PG_MIGRATEUR_PASSWORD manquant (.env)}
  PG_WRITER_PASSWORD: ${PG_WRITER_PASSWORD:?PG_WRITER_PASSWORD manquant (.env)}
  PG_READER_PASSWORD: ${PG_READER_PASSWORD:?PG_READER_PASSWORD manquant (.env)}
  PG_DOSSIERS_PASSWORD: ${PG_DOSSIERS_PASSWORD:?PG_DOSSIERS_PASSWORD manquant (.env)}
  PG_TRACES_WRITER_PASSWORD: ${PG_TRACES_WRITER_PASSWORD:?PG_TRACES_WRITER_PASSWORD manquant (.env)}
  PG_TRACES_READER_PASSWORD: ${PG_TRACES_READER_PASSWORD:?PG_TRACES_READER_PASSWORD manquant (.env)}
  PG_AGENT_STATE_PASSWORD: ${PG_AGENT_STATE_PASSWORD:?PG_AGENT_STATE_PASSWORD manquant (.env)}
  PG_POINTS_REPRISE_PASSWORD: ${PG_POINTS_REPRISE_PASSWORD:?PG_POINTS_REPRISE_PASSWORD manquant (.env)}

services:
  postgres:
    build: infra/postgres
    environment:
      <<: *mots-de-passe
      POSTGRES_PASSWORD: ${PG_POSTGRES_PASSWORD:?PG_POSTGRES_PASSWORD manquant (.env)}
      PG_BASES_TEST: "1"
    ports: ["${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vecteurs"]
      interval: 2s
      timeout: 3s
      retries: 30

  rag:
    build: { context: ., dockerfile: rag/Dockerfile }
    environment:
      PG_HOST: postgres
      PG_MIGRATEUR_PASSWORD: ${PG_MIGRATEUR_PASSWORD} # au démarrage seulement (demarrer.sh)
      PG_WRITER_PASSWORD: ${PG_WRITER_PASSWORD}
      PG_READER_PASSWORD: ${PG_READER_PASSWORD}
      # LLM par la gateway, jeton d'application de rag (RAG_CLIENT_SECRET ci-dessous), aucune clé
      AZURE_OPENAI_ENDPOINT: http://gateway:8000/api/llm
      LLM_AUDIENCE: ${LLM_AUDIENCE:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      RAG_API_CLIENT_ID: ${RAG_API_CLIENT_ID:-}
      # même liste que la gateway (Entra__Audiences__rag__0), même défaut
      RAG_API_AUDIENCES: ${RAG_API_AUDIENCES:-api://agentinsurflow-rag}
      RAG_SEUIL: ${RAG_SEUIL:-} # à calibrer (make calibrer) ; vide → /api/extraits en 503
      # dossiers en On-Behalf-Of, par la gateway (D22) ; secret : .env local seulement
      UNDERWRITING_API_CLIENT_ID: ${UNDERWRITING_API_CLIENT_ID:-}
      UNDERWRITING_URL: http://gateway:8000
      RAG_CLIENT_SECRET: ${RAG_CLIENT_SECRET:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://underwriting-admin:8002/v1/traces
      APP_ENV: local
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }

  serveur-mcp:
    build: { context: ., dockerfile: serveur-mcp/Dockerfile }
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      MCP_API_CLIENT_ID: ${MCP_API_CLIENT_ID:-}
      # même liste que la gateway (Entra__Audiences__mcp__0), même défaut
      MCP_API_AUDIENCES: ${MCP_API_AUDIENCES:-api://agentinsurflow-mcp}
      # azp des agents (matrice d'accès) : vides tant que les inscriptions de #7 n'existent pas
      MCP_AZP_ORCHESTRATEUR: ${MCP_AZP_ORCHESTRATEUR:-}
      MCP_AZP_REDACTEUR: ${MCP_AZP_REDACTEUR:-}
      MCP_AZP_ACTUAIRE: ${MCP_AZP_ACTUAIRE:-}
      MCP_AZP_PIECES: ${MCP_AZP_PIECES:-}
      MCP_AZP_ANALYSTE: ${MCP_AZP_ANALYSTE:-}
      # rag et dossiers en On-Behalf-Of, par la gateway (D22) ; secret : .env local seulement
      RAG_API_CLIENT_ID: ${RAG_API_CLIENT_ID:-}
      UNDERWRITING_API_CLIENT_ID: ${UNDERWRITING_API_CLIENT_ID:-}
      GATEWAY_URL: http://gateway:8000
      CALCUL_URL: http://gateway:8000/api/calcul  # via la gateway : jeton d'application (rôle Calcul)
      CALCUL_AUDIENCE: ${CALCUL_AUDIENCE:-}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://underwriting-admin:8002/v1/traces  # direct en local (comme rag) ; Azure : par la gateway, rôle Telemetrie
      APP_ENV: local
    ports: ["8003:8003"]

  # Cluster d'agents (graphe LangGraph) : aucun port publié, joint par la gateway (T12) ; il appelle
  # le MCP et le LLM par la gateway seulement (D22). Modèles LLM Guard cuits dans l'image.
  agentic-cluster:
    build: { context: ., dockerfile: agentic-cluster/Dockerfile }
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      GATEWAY_URL: http://gateway:8000
      MCP_API_CLIENT_ID: ${MCP_API_CLIENT_ID:-}
      LLM_AUDIENCE: ${LLM_AUDIENCE:-}
      INSURFLOW_LLM_ACTIF: ${INSURFLOW_LLM_ACTIF:-true}
      INSURFLOW_CLUSTER_CLIENT_ID: ${INSURFLOW_CLUSTER_CLIENT_ID:-}
      INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID: ${INSURFLOW_AGENT_ORCHESTRATEUR_CLIENT_ID:-}
      INSURFLOW_AGENT_PIECES_CLIENT_ID: ${INSURFLOW_AGENT_PIECES_CLIENT_ID:-}
      INSURFLOW_AGENT_ANALYSTE_CLIENT_ID: ${INSURFLOW_AGENT_ANALYSTE_CLIENT_ID:-}
      INSURFLOW_AGENT_REDACTEUR_CLIENT_ID: ${INSURFLOW_AGENT_REDACTEUR_CLIENT_ID:-}
      INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID: ${INSURFLOW_AGENT_ACTUAIRE_CLIENT_ID:-}
      INSURFLOW_CLIENT_SECRET: ${INSURFLOW_CLIENT_SECRET:-} # .env local seulement
      INSURFLOW_PIECES_EXIGEES: ${INSURFLOW_PIECES_EXIGEES:-}
      INSURFLOW_BUDGET_S: ${INSURFLOW_BUDGET_S:-25}
      INSURFLOW_RESERVE_S: ${INSURFLOW_RESERVE_S:-2}
      INSURFLOW_CHECKPOINT_DSN: ${INSURFLOW_CHECKPOINT_DSN:-} # vide : points de reprise en mémoire
      OTEL_SERVICE_NAME: agentic-cluster
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://underwriting-admin:8002/v1/traces
      APP_ENV: local
    depends_on: [gateway]

  # Function de calcul (barème + formule) : réseau interne seulement, aucun port publié
  calcul:
    build: { context: ., dockerfile: fonction-calcul/Dockerfile }
    platform: linux/amd64 # l'image Functions n'existe qu'en amd64 (émulée sur Mac Apple Silicon)
    environment:
      APP_VERSION: dev

  underwriting-admin:
    build: { context: ., dockerfile: underwriting-admin/Dockerfile }
    environment:
      AzureAd__TenantId: ${AZURE_TENANT_ID:?AZURE_TENANT_ID manquant (.env)}
      AzureAd__ClientId: ${UNDERWRITING_API_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      # liste « a, b » : la même que celle lue par la gateway
      Entra__Audiences__underwriting__0: ${UNDERWRITING_API_AUDIENCES:-api://agentinsurflow-underwriting}
      # base dossiers : migrations au démarrage (migrateur), lecture de la vue (dossiers)
      Migrations__AuDemarrage: "true"
      PG_HOST: postgres
      PG_MIGRATEUR_PASSWORD: ${PG_MIGRATEUR_PASSWORD} # au démarrage seulement
      PG_DOSSIERS_PASSWORD: ${PG_DOSSIERS_PASSWORD}
      # base traces : écriture (traces_writer) et relecture (traces_reader) ; migrations par migrateur
      PG_TRACES_WRITER_PASSWORD: ${PG_TRACES_WRITER_PASSWORD}
      PG_TRACES_READER_PASSWORD: ${PG_TRACES_READER_PASSWORD}
      # règle S3-21 : sans jeton, la loopback et le réseau interne du compose (sans X-Forwarded-For) ; Azure : loopback seule
      Otlp__SourcesSansJeton: 127.0.0.1/32,::1/128,172.29.250.0/24
      # oid fictifs en local ; en Azure, ceux de deux gestionnaires de test (jamais commités)
      SEED_GESTIONNAIRE_A: ${SEED_GESTIONNAIRE_A:-00000000-0000-0000-0000-00000000000a}
      SEED_GESTIONNAIRE_B: ${SEED_GESTIONNAIRE_B:-00000000-0000-0000-0000-00000000000b}
      SEED_GESTIONNAIRE_C: ${SEED_GESTIONNAIRE_C:-00000000-0000-0000-0000-00000000000c}
    ports: ["8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment:
      ReverseProxy__Clusters__rag__Destinations__d1__Address: http://rag:8001
      ReverseProxy__Clusters__underwriting__Destinations__d1__Address: http://underwriting-admin:8002
      ReverseProxy__Clusters__mcp__Destinations__d1__Address: http://serveur-mcp:8003
      ReverseProxy__Clusters__cluster__Destinations__d1__Address: http://agentic-cluster:8004
      ReverseProxy__Clusters__calcul__Destinations__d1__Address: http://calcul:80
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://underwriting-admin:8002/v1/traces
      Entra__TenantId: ${AZURE_TENANT_ID:?AZURE_TENANT_ID manquant (.env)}
      # une liste « a, b » par service, la même que celle lue par le service lui-même
      Entra__Audiences__rag__0: ${RAG_API_AUDIENCES:-api://agentinsurflow-rag}
      Entra__Audiences__underwriting__0: ${UNDERWRITING_API_AUDIENCES:-api://agentinsurflow-underwriting}
      Entra__Audiences__mcp__0: ${MCP_API_AUDIENCES:-api://agentinsurflow-mcp}
      Entra__McpClientId: ${MCP_API_CLIENT_ID:-}  # azp des jetons OBO du MCP (vide : PUT …/etat refusé)
      Entra__Audiences__cluster__0: ${CLUSTER_API_AUDIENCES:-api://agentinsurflow-cluster}
      Entra__Audiences__cluster__1: ${INSURFLOW_CLUSTER_CLIENT_ID:-}
      Entra__Audiences__calcul__0: ${CALCUL_API_AUDIENCES:-api://agentinsurflow-calcul}
      Entra__Audiences__calcul__1: ${CALCUL_API_CLIENT_ID:-}
      Entra__Audiences__llm__0: ${LLM_API_AUDIENCES:-api://agentinsurflow-llm}
      Entra__Audiences__llm__1: ${LLM_API_CLIENT_ID:-}
      # Foundry : endpoint, et secret d'application de la gateway (local) ; vide = identité managée
      ReverseProxy__Clusters__llm__Destinations__d1__Address: ${FOUNDRY_ENDPOINT:-http://localhost:8010}
      Gateway__ClientId: ${GATEWAY_CLIENT_ID:-}
      Gateway__ClientSecret: ${GATEWAY_CLIENT_SECRET:-}
      SWAGGER_CLIENT_ID: ${RAG_API_CLIENT_ID:-}
      # espace gestionnaire http://localhost:8000/app/ (#103) : configuration publique, sans secret
      Espace__Authority: https://login.microsoftonline.com/${AZURE_TENANT_ID:-common}
      Espace__Scopes__Rag: api://agentinsurflow-rag/access_as_user
      Espace__Scopes__Underwriting: api://agentinsurflow-underwriting/access_as_user
      Espace__Scopes__Cluster: api://agentinsurflow-cluster/access_as_user
      Espace__Comptes__A: ${ESPACE_COMPTE_A:-}
      Espace__Comptes__B: ${ESPACE_COMPTE_B:-}
    ports: ["8000:8000"]
    depends_on: [rag, underwriting-admin, serveur-mcp]

# Réseau interne à plage fixe : c'est celle que /v1/traces accepte sans jeton (Otlp__SourcesSansJeton)
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.250.0/24
