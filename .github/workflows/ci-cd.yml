# Chaîne du socle (CI/CD/Evals)
#   PR    : lint → test → [evals-pr]                       (portes exigées par la protection de main)
#           evals-pr évalue staging si les jeux ont changé, si la PR porte le libellé « evals »,
#           ou à la main (workflow_dispatch) ; il commente le résumé sur la PR.
#   merge : lint → test → build → staging (+ fumée) → [evals] + e2e-staging → release → production (+ fumée)
#   integration (compose + TI) et pyramide tournent en parallèle ; pyramide est informative (voir le job).
# [evals…] ne tournent QUE si le prompt, le golden dataset ou la version du LLM ont changé depuis le
# dernier manifeste validé (job changements) ; sinon ils sont sautés et la chaîne continue.
# Versions, gravées dans l'image et lues sur /health : SHA du commit ; release vX.Y.Z (tag posé
# juste avant la production) ; manifeste X.Y.Z-build.N (tag manifeste-… posé si les evals passent).
name: ci-cd

on:
  pull_request:
    # ponytail: un autre libellé relance aussi la chaîne de PR (annulée par cancel-in-progress) ;
    # filtrer par job si ça gêne.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {} # evals-pr à la main (OIDC fédéré pour main seulement : lancer depuis main)
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fichiers qui peuvent changer le résultat des évaluations
  DECLENCHEURS_EVALS: '^(rag/agentinsurflow_rag/prompts/|eval/golden\.jsonl$|eval/questions-demo\.jsonl$|data/raw/|rag/llm\.env$)'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - run: make install
      - run: make lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - uses: actions/setup-node@v4 # modules ES de la page (gateway/wwwroot/app) testés par node --test
        with: { node-version: "22" }
      - run: make install
      # TU seuls, sans Docker : les TU + TI (et la couverture) tournent dans le job integration
      - run: make test

  gateway:
    # Gateway YARP (C#, .NET 10) : format + analyseurs, puis TI avec couverture >= 80 %.
    # ponytail: lancé à chaque run (< 1 min) plutôt que filtré par chemin ; filtrer si la CI ralentit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: make -C gateway lint
      - run: make -C gateway test

  underwriting-admin:
    # underwriting-admin (C#, .NET 10) : format + analyseurs, puis compilation. Ses TU + TI (couverture
    # >= 80 %) ont besoin du PostgreSQL du compose : ils tournent dans le job integration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: make -C underwriting-admin lint
      - run: make -C underwriting-admin build

  integration:
    # Le compose (PostgreSQL annexe) : TU + TI de rag, puis TU + TI d'underwriting-admin contre la même base.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - name: Mots de passe PostgreSQL éphémères (générés à chaque run, jamais stockés)
        run: |
          for v in MIGRATEUR WRITER READER DOSSIERS TRACES_WRITER TRACES_READER POINTS_REPRISE POSTGRES; do
            mdp=$(openssl rand -hex 16); echo "::add-mask::$mdp"
            echo "PG_${v}_PASSWORD=$mdp" >> "$GITHUB_ENV"
          done
      - run: make install
      - run: make test-integration # démarre le postgres du compose, puis TU + TI de rag
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }} # lu par le compose (services non démarrés ici)
      - run: make -C underwriting-admin test # TI contre le postgres déjà démarré (PG_* de l'environnement)
      - if: always()
        run: docker compose down -v
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

  pyramide:
    # ponytail: INFORMATIVE (décision d'Acerola) tant que la tâche dédiée aux TU d'underwriting-admin n'est pas
    # livrée : la pyramide est encore hors seuils. À rendre bloquante ensuite : retirer continue-on-error
    # et ajouter « pyramide » aux contextes de infra/protection-main.json.
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: make install
      - run: make pyramide

  changements:
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
      manifeste: ${{ steps.diff.outputs.manifeste }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # historique + tags
      - name: Manifeste modifié depuis le dernier validé ? Versions de release et de manifeste
        id: diff
        run: |
          # Dernier manifeste validé = tag manifeste-X.Y.Z-build.N, posé par release quand les evals passent
          dernier=$(git describe --tags --match 'manifeste-*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ -z "$dernier" ]; then
            evals=true; echo "Aucun manifeste validé : évaluations lancées"
          else
            declencheurs=$(git diff --name-only "$dernier" HEAD | grep -E "$DECLENCHEURS_EVALS" || true)
            evals=$([ -n "$declencheurs" ] && echo true || echo false)
            echo "Déclencheurs modifiés depuis $dernier : ${declencheurs:-aucun}"
          fi
          if [ "$evals" = true ]; then  # nouveau manifeste : X.Y.Z-build.<n° de ce run>
            manifeste=$(python3 -c 'from tools.evals import version_manifeste; print(version_manifeste())')
          else
            manifeste=${dernier#manifeste-}
          fi
          release=$(python3 tools/version.py) # candidate tant que le job release ne l'a pas posée
          printf 'evals=%s\nmanifeste=%s\nrelease=%s\n' "$evals" "$manifeste" "$release" >> "$GITHUB_OUTPUT"
          echo "Release $release · manifeste $manifeste"
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

  modele:
    # Porte du GLM de fréquence (C13) : ne travaille que si le modèle, ses données ou son code ont changé ;
    # sinon les pas sont sautés et le job passe. Un échec ici bloque staging (voir ses needs).
    needs: lint
    runs-on: ubuntu-latest
    env:
      FREMTPL2_CACHE: /tmp/fremtpl2-cache
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Le modèle est-il touché ?
        id: diff
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            touches=$(git diff --name-only "$base" HEAD | grep -E "$DECLENCHEURS_MODELE" || true)
          else
            touches="base inconnue"
          fi
          echo "Fichiers du modèle modifiés : ${touches:-aucun}"
          echo "actif=$([ -n "$touches" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          DECLENCHEURS_MODELE: '^(uv\.lock|fonction-calcul/pyproject\.toml|\.github/workflows/ci-cd\.yml)$|^fonction-calcul/(entrainement/|agentinsurflow_calcul/(domain/frequence\.py|domain/regions\.py|modeles/))'
      - if: steps.diff.outputs.actif == 'true'
        uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - if: steps.diff.outputs.actif == 'true'
        uses: actions/cache@v4 # freMTPL2 (SHA-256 vérifié au chargement) : téléchargé une fois par version des données
        with:
          path: ${{ env.FREMTPL2_CACHE }}
          key: fremtpl2-${{ hashFiles('fonction-calcul/entrainement/donnees.toml') }}
      - if: steps.diff.outputs.actif == 'true'
        run: make install
      - name: Tests de la Function, dont les tests lents (données réelles)
        if: steps.diff.outputs.actif == 'true'
        run: uv run pytest fonction-calcul/tests -m "lent or not lent" --no-cov
      - name: Réentraîner (porte seuils.toml)
        if: steps.diff.outputs.actif == 'true'
        run: make modele
      - name: L'artefact réentraîné est identique au commité (hors commit et date)
        if: steps.diff.outputs.actif == 'true'
        run: |
          python3 - <<'PY'
          import difflib, json, math, subprocess
          from pathlib import Path
          dossier = "fonction-calcul/agentinsurflow_calcul/modeles"
          commite = subprocess.run(["git", "ls-tree", "--name-only", "HEAD", f"{dossier}/"],
                                   capture_output=True, text=True, check=True).stdout.split()
          commite = [f for f in commite if f.endswith(".json")]
          assert len(commite) == 1, f"un seul artefact commité attendu : {commite}"
          recent = max(Path(dossier).glob("*.json"), key=lambda p: p.stat().st_mtime)
          # commit, date d'entraînement et version (nommée d'après la date) changent à chaque exécution
          # écart BLAS macOS (commité) / Linux (CI) mesuré le 28/10 : ≤ 6e-5 relatif ; 1e-3 l'absorbe,
          # un changement de données ou de code déplace les coefficients bien au-delà
          def proche(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  return a.keys() == b.keys() and all(proche(a[k], b[k]) for k in a)
              if isinstance(a, list) and isinstance(b, list):
                  return len(a) == len(b) and all(map(proche, a, b))
              if isinstance(a, float) or isinstance(b, float):
                  return (all(isinstance(x, (int, float)) for x in (a, b))
                          and math.isclose(a, b, rel_tol=1e-3, abs_tol=1e-6))
              return a == b
          def charge(texte):
              d = json.loads(texte)
              for cle in ("commit", "entraine_le", "version"):
                  d.pop(cle, None)
              # fréquence observée par décile : quelques contrats changent de décile au moindre écart de
              # prédiction (1,6e-3 relatif mesuré), elle n'est pas reproductible d'une machine à l'autre
              for c in d.get("metriques", {}).get("calibration", []):
                  c.pop("observee", None)
              return d
          avant = charge(subprocess.run(["git", "show", f"HEAD:{commite[0]}"], capture_output=True,
                                        text=True, check=True).stdout)
          apres = charge(recent.read_text("utf-8"))
          if not proche(avant, apres):
              lignes = [json.dumps(d, sort_keys=True, indent=2).splitlines() for d in (avant, apres)]
              print("\n".join(difflib.unified_diff(*lignes, "commité", "réentraîné", lineterm="")))
              raise SystemExit("réentraîné ≠ commité : commiter le nouvel artefact")
          print(f"✔ {recent.name} identique à {commite[0]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.diff.outputs.actif == 'true'
        with:
          name: rapport-modele-${{ github.sha }}
          path: rapport-modele.md
          if-no-files-found: warn

  evals-pr:
    # Évalue l'API de STAGING (rag ne peut pas obtenir de jeton LLM sur un runner) avec les jeux de la PR.
    # Lancé si les déclencheurs d'évaluation ont changé, si la PR porte le libellé « evals », ou à la main.
    needs: [test, changements]
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (needs.changements.outputs.evals == 'true' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'evals'))
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, pull-requests: write }
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - run: make install
      - run: make donnees-evals # jeux d'évaluation cohérents, hors ligne, avant toute connexion
      - uses: azure/login@v2 # OIDC : le jeton d'évaluation est demandé à Entra, aucun secret
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: URL de staging connue ?
        run: |
          [ -n "$STAGING_URL" ] || { echo "::error::variable STAGING_URL absente (gh variable set STAGING_URL)"; exit 1; }
      - name: Golden set + jeu de démo de la PR contre staging (porte bloquante)
        run: |
          EVALS_JETON=$(az account get-access-token --scope "api://agentinsurflow-rag/.default" \
            --query accessToken -o tsv)
          echo "::add-mask::$EVALS_JETON"
          export EVALS_JETON
          python3 tools/evals.py --url "$STAGING_URL" --questions eval/questions-demo.jsonl \
            --sans-dossiers --rapport evals-pr.json --resume evals-pr.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-pr-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evals-pr.json
            evals-pr.md
          if-no-files-found: warn
      - name: Résumé du run et commentaire sur la PR
        if: ${{ !cancelled() }} # un run annulé (nouveau libellé) ne doit pas écrire « rapport absent »
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f evals-pr.md ] || echo "✘ rapport absent : voir le run $RUN" > evals-pr.md
          cat evals-pr.md >> "$GITHUB_STEP_SUMMARY"
          # un seul commentaire du bot par PR, édité à chaque passage
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file evals-pr.md --edit-last --create-if-none
          fi

  build:
    needs: [test, integration, changements]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2 # OIDC : aucun secret de longue durée
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Image du cluster ≈ 9 Go (torch CPU + modèles LLM Guard) : le runner ubuntu-latest n'a ≈ 14 Go libres, on retire d'abord
      # les chaînes d'outils que le build n'utilise pas (Docker seul)
      - name: Libérer du disque pour l'image du cluster
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Construire et publier les images rag, underwriting, gateway, serveur MCP et cluster (tag = SHA, immuable)
        env:
          ACR: ${{ vars.ACR_NAME }}.azurecr.io
          SHA: ${{ github.sha }}
          RELEASE: ${{ needs.changements.outputs.release }}
          MANIFESTE: ${{ needs.changements.outputs.manifeste }}
        run: |
          az acr login -n "${{ vars.ACR_NAME }}"
          # Cache inline : chaque image reprend les couches de la dernière image de main (tag flottant
          # « main », jamais déployé : deploy.yml ne lit que le SHA). Sans lui, torch, LLM Guard et les
          # modèles (cluster ≈ 9 Go) sont retéléchargés à chaque build. Absent au 1er build : ignoré.
          construire() { # dépôt Dockerfile [build-args…]
            local depot=$1 fichier=$2; shift 2
            docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$ACR/agentinsurflow-$depot:main" \
              --build-arg APP_VERSION="$SHA" "$@" -f "$fichier" \
              -t "$ACR/agentinsurflow-$depot:$SHA" -t "$ACR/agentinsurflow-$depot:main" .
          }
          # /health : SHA de l'image, release vX.Y.Z (et manifeste pour rag), gravés au build
          construire rag rag/Dockerfile --build-arg APP_RELEASE="$RELEASE" --build-arg APP_MANIFESTE="$MANIFESTE"
          construire underwriting underwriting-admin/Dockerfile --build-arg APP_RELEASE="$RELEASE"
          construire gateway gateway/Dockerfile --build-arg APP_RELEASE="$RELEASE"
          construire mcp serveur-mcp/Dockerfile --build-arg APP_RELEASE="$RELEASE"
          construire cluster agentic-cluster/Dockerfile
          for depot in rag underwriting gateway mcp cluster; do
            docker push "$ACR/agentinsurflow-$depot:$SHA"
            docker push "$ACR/agentinsurflow-$depot:main"
          done

  staging:
    # modele sauté ou passé = feu vert ; modele en échec = pas de staging
    needs: [build, modele]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.modele.result == 'success' || needs.modele.result == 'skipped') }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/deploy.yml
    with: { environnement: staging, tag: "${{ github.sha }}" }
    secrets: inherit

  evals:
    needs: [staging, changements]
    if: needs.changements.outputs.evals == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2 # OIDC : le jeton d'évaluation est demandé à Entra, aucun secret
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Golden set + jeu de démo contre staging (porte bloquante)
        run: |
          # 🔴 A4 : l'identité de CI doit porter le rôle Gestionnaire sur agentinsurflow-rag
          EVALS_JETON=$(az account get-access-token --scope "api://agentinsurflow-rag/.default" \
            --query accessToken -o tsv)
          echo "::add-mask::$EVALS_JETON"
          export EVALS_JETON
          # --sans-dossiers : cas à numero_contrat écartés jusqu'à underwriting-admin (U2)
          python3 tools/evals.py --url "${{ needs.staging.outputs.url }}" \
            --questions eval/questions-demo.jsonl --sans-dossiers --rapport evals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-staging-${{ github.sha }}
          path: evals.json
          if-no-files-found: error

  e2e-staging:
    # Parcours bout en bout via la gateway de staging ; manque d'environnement = échec (E2E_STRICT)
    needs: staging
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.13", enable-cache: true }
      - uses: azure/login@v2 # OIDC : jetons demandés à Entra, aucun secret
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: make install
      - name: E2E contre staging (porte bloquante)
        env:
          E2E_STRICT: "1"
          # contrat d'un gestionnaire de la CI (témoin positif BOLA) : variable GitHub, pas un secret
          E2E_CONTRAT_PROPRE: ${{ vars.E2E_CONTRAT_PROPRE }}
          E2E_CONTRAT_HOSTILE: ${{ vars.E2E_CONTRAT_HOSTILE }}
          E2E_CONTRAT_PAUSE: ${{ vars.E2E_CONTRAT_PAUSE }}
          E2E_CLUSTER_INTERNE: https://${{ needs.staging.outputs.cluster_fqdn }}
        run: |
          # 🔴 A4 : l'identité de CI porte les rôles Gestionnaire/Ingestion (rag), Gestionnaire (underwriting et serveur MCP)
          jeton() { az account get-access-token --scope "api://$1/.default" --query accessToken -o tsv; }
          E2E_JETON_GESTIONNAIRE=$(jeton agentinsurflow-rag); echo "::add-mask::$E2E_JETON_GESTIONNAIRE"
          E2E_JETON_INGESTION=$E2E_JETON_GESTIONNAIRE
          E2E_JETON_GESTIONNAIRE_UNDERWRITING=$(jeton agentinsurflow-underwriting); echo "::add-mask::$E2E_JETON_GESTIONNAIRE_UNDERWRITING"
          E2E_JETON_MCP=$(jeton agentinsurflow-mcp); echo "::add-mask::$E2E_JETON_MCP"
          # cluster d'agents : jeton d'application (CI), donc ses parcours d'évaluation (OBO) sont sautés ; la fumée et l'entrée interne tournent
          E2E_JETON_CLUSTER=$(jeton agentinsurflow-cluster); echo "::add-mask::$E2E_JETON_CLUSTER"
          export E2E_JETON_GESTIONNAIRE E2E_JETON_INGESTION E2E_JETON_GESTIONNAIRE_UNDERWRITING E2E_JETON_MCP E2E_JETON_CLUSTER
          make test-e2e URL="${{ needs.staging.outputs.url }}"

  release:
    needs: [changements, staging, evals, e2e-staging]
    # evals sautées (rien à évaluer) = feu vert ; evals ou E2E en échec = ni tag ni production
    if: >-
      ${{ !cancelled() && needs.changements.result == 'success'
      && needs.staging.result == 'success' && needs.evals.result != 'failure'
      && needs.e2e-staging.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write } # pousser les tags
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tous les tags
      - name: Tagger le commit vX.Y.Z (avant la production) et, si évalué, son manifeste
        env:
          RELEASE: ${{ needs.changements.outputs.release }}
          MANIFESTE: ${{ needs.changements.outputs.manifeste }}
          EVALUE: ${{ needs.evals.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tags=("$RELEASE")
          [ "$EVALUE" = true ] && tags+=("manifeste-$MANIFESTE") # manifeste validé par les evals
          for tag in "${tags[@]}"; do   # relance : tag déjà posé, on ne le refait pas
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null && continue
            git tag -a "$tag" -m "$tag — image agentinsurflow:${{ github.sha }}, manifeste $MANIFESTE"
            git push origin "$tag"
          done
          echo "✔ release $RELEASE · manifeste $MANIFESTE → image ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    needs: [release, changements]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions: { contents: read, id-token: write }
    uses: ./.github/workflows/deploy.yml
    # release : deploy.yml refuse une version sous celle en service (hors rollback)
    with:
      environnement: production
      tag: "${{ github.sha }}"
      release: "${{ needs.changements.outputs.release }}"
    secrets: inherit
